name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: CLEAN EVERYTHING
        run: |
          # إيقاف gradle daemon
          gradle --stop || true
          
          # حذف جميع الـ caches
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf ~/.m2/repository/
          
          # حذف كل ملفات البناء القديمة
          rm -rf .gradle
          rm -rf build
          rm -rf app/build
          rm -rf app/.cxx
          
          # حذف كل ملفات APK القديمة
          find . -name "*.apk" -type f -delete
          find . -type d -name "build" -exec rm -rf {} +
          
          # حذف الملفات المولدة
          rm -rf app/google-services.json
          rm -rf debug.keystore
          rm -rf release.keystore
          rm -rf .idea
          rm -rf local.properties
          
          echo "=== ALL CLEANED ==="

      - name: Prepare build environment
        run: |
          mkdir -p app
          touch .env .env.example
          
          # إنشاء keystore جديد
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          # إنشاء google-services.json
          echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          
          # عرض معلومات المشروع الحالي للتأكد
          echo "=== Current Project Info ==="
          if [ -f "app/build.gradle" ]; then
            cat app/build.gradle | grep -E "applicationId|namespace"
          elif [ -f "app/build.gradle.kts" ]; then
            cat app/build.gradle.kts | grep -E "applicationId|namespace"
          fi
          echo "=== End Project Info ==="

      - name: Build Debug APK
        run: |
          # تنظيف إضافي قبل البناء
          gradle clean cleanBuildCache --no-daemon
          
          # البناء مع تجاهل cache
          gradle assembleDebug \
            --no-configuration-cache \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies \
            --rerun-tasks \
            --stacktrace

      - name: Verify built APK
        run: |
          echo "=== Built APK Files ==="
          find . -name "*.apk" -type f -ls
          
          # التحقق من اسم الحزمة في APK
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            echo "APK found: $APK_FILE"
            # استخدام aapt للتحقق من اسم الحزمة
            if command -v aapt2 &> /dev/null; then
              aapt2 dump packagename "$APK_FILE"
            fi
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
          if-no-files-found: error
