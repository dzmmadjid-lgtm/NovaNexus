name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project (clic.zip)
        run: |
          rm -rf clic_project
          mkdir -p clic_project
          # تأكدنا من اسم الملف clic.zip
          unzip -o clic.zip -d clic_project

          echo "======================================"
          echo "PROJECT EXTRACTED"
          echo "======================================"

          cd clic_project
          ls -la
          
          # التأكد من وجود settings.gradle.kts و app
          if [ -f "settings.gradle.kts" ]; then
             echo "Project root found successfully!"
          else
             echo "WARNING: settings.gradle.kts not found in root. Moving deeper..."
             # إذا كان الملف داخل مجلد فرعي، سننتقل إليه تلقائياً
             cd "$(find . -maxdepth 2 -name "settings.gradle.kts" -printf '%h' -quit)"
             ls -la
          fi

      - name: Create debug keystore
        working-directory: clic_project
        run: |
          echo "======================================"
          echo "CREATING DEBUG KEYSTORE"
          echo "======================================"

          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          fi

          ls -lh debug.keystore

      - name: Check Gradle
        working-directory: clic_project
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

      - name: Build Debug APK
        working-directory: clic_project
        run: |
          echo "======================================"
          echo "BUILDING CLIC APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Locate APK
        if: success()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find clic_project \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Clic-debug-apk
          path: clic_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build completed
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "       CLIC BUILD SUCCESS"
          echo "======================================"
          echo ""
