name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract and Find Project
      run: |
        unzip nova-nexus.zip -d extracted_files
        # البحث عن مجلد يحتوي على gradlew والانتقال إليه لتنفيذ البناء
        cd "$(find extracted_files -name "gradlew" -exec dirname {} \; | head -n 1)"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
