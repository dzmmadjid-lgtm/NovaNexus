name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        # فك الضغط في مجلد العمل
        unzip nova-nexus.zip -d project_files
        
        # الدخول إلى المجلد الرئيسي الذي يحتوي على settings.gradle.kts
        # (لا نستخدم find هنا حتى لا ندخل لمجلد app بالخطأ)
        cd project_files
        
        # عرض الملفات للتأكد أن settings.gradle.kts موجود هنا
        echo "المجلد الحالي هو:"
        pwd
        ls -la
        
        # بناء التطبيق (الأمر الصحيح من الجذر)
        gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: 'project_files/**/build/outputs/apk/debug/*.apk'
