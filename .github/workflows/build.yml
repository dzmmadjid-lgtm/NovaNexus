name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show all repository files
        run: |
          echo "=== محتويات المستودع الحالية ==="
          ls -la
          echo "=== البحث عن ملفات gradle في المستودع ==="
          find . -name "*gradle*"
