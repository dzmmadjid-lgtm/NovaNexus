name: Dynamic Clean Android Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Clean Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: 2. Inspect Repository & Locate ZIP
        id: locate_zip
        run: |
          echo "Scanning repository..."
          LATEST_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" -printf '%T@ %p\n' | sort -n | tail -1 | cut -f2- -d" ")
          if [ -n "$LATEST_ZIP" ]; then
            echo "ZIP_PATH=$LATEST_ZIP" >> $GITHUB_ENV
            echo "HAS_ZIP=true" >> $GITHUB_ENV
          else
            echo "HAS_ZIP=false" >> $GITHUB_ENV
          fi

      - name: 3. Create Clean Workspace & Extract Project
        id: setup_workspace
        run: |
          WORK_DIR="${{ github.workspace }}/clean_project_workspace"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          
          if [ "$HAS_ZIP" = "true" ]; then
            unzip -o -q "$ZIP_PATH" -d "$WORK_DIR"
          else
            rsync -av --exclude='.git' --exclude='.github' --exclude='clean_project_workspace' ./ "$WORK_DIR/"
          fi

          SETTINGS_FILE=$(find "$WORK_DIR" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find "$WORK_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
            PROJECT_ROOT=$(dirname "$BUILD_FILE")
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 7. Prepare Environment
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p app
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env .env.example local.properties
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
          fi

      - name: 8. Execute Gradle Build
        run: |
          cd "$PROJECT_ROOT"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --info
          else
            gradle assembleDebug --no-daemon --info
          fi

      - name: 9. Upload Generated APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Build-APK
          path: "${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk"
          retention-days: 14
