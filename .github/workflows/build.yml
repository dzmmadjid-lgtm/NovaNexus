name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        # تثبيت أداة Gradle مباشرة في نظام أوبونتو السحابي
        sudo apt-get update && sudo apt-get install -y gradle
        
        # فك الضغط في مجلد العمل
        unzip nova-nexus.zip -d project_files
        cd project_files
        
        # بناء التطبيق مباشرة باستخدام gradle المثبت
        gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
