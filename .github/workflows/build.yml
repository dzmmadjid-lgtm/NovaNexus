name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        # 1. فك الضغط في مجلد العمل
        unzip nova-nexus.zip -d project_files
        
        # 2. الدخول إلى المجلد الرئيسي الذي يحتوي على settings.gradle.kts
        cd project_files
        
        # 3. البحث عن المجلد الداخلي (مثل nova-nexus) والدخول إليه إذا كان موجوداً
        # إذا لم يوجد مجلد داخلي، سيظل في project_files
        if [ -d "$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)" ]; then
          cd "$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)"
        fi
        
        # 4. عرض الملفات للتأكد من وجود settings.gradle.kts هنا
        echo "المجلد الحالي هو:"
        pwd
        ls -la
        
        # 5. بناء التطبيق (الأمر الصحيح هو بناء وحدة app)
        gradle :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: 'project_files/**/build/outputs/apk/debug/*.apk'
