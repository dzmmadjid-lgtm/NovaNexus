name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Gradle
      # لا نعتمد على Gradle الموجود في Ubuntu
      # لأن المشروع لا يحتوي على gradlew داخل ملف ZIP.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. فك ضغط المشروع
      - name: Extract Android project
        run: |
          rm -rf project_files
          mkdir -p project_files

          unzip -o nova-nexus.zip -d project_files

          echo "======================================"
          echo "Project extracted successfully"
          echo "======================================"

      # 5. فحص بنية المشروع
      - name: Inspect project
        run: |
          cd project_files

          echo "======================================"
          echo "CURRENT DIRECTORY"
          echo "======================================"
          pwd

          echo "======================================"
          echo "ROOT FILES"
          echo "======================================"
          ls -la

          echo "======================================"
          echo "APP DIRECTORY"
          echo "======================================"

          if [ -d "app" ]; then
            ls -la app
          else
            echo "ERROR: app directory was not found!"
            exit 1
          fi

          echo "======================================"
          echo "SETTINGS.GRADLE.KTS"
          echo "======================================"

          if [ -f "settings.gradle.kts" ]; then
            cat settings.gradle.kts
          else
            echo "ERROR: settings.gradle.kts was not found!"
            exit 1
          fi

          echo "======================================"
          echo "APP BUILD.GRADLE.KTS"
          echo "======================================"

          if [ -f "app/build.gradle.kts" ]; then
            cat app/build.gradle.kts
          else
            echo "ERROR: app/build.gradle.kts was not found!"
            exit 1
          fi

      # 6. إظهار مشاريع Gradle
      # هذه الخطوة مهمة جدًا للتأكد أن :app مسجل فعليًا.
      - name: Check Gradle projects
        working-directory: project_files
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

          echo "======================================"
          echo "GRADLE PROJECTS"
          echo "======================================"

          gradle projects

      # 7. عرض مهام البناء
      - name: Check Android build tasks
        working-directory: project_files
        run: |
          echo "======================================"
          echo "AVAILABLE BUILD TASKS"
          echo "======================================"

          gradle :app:tasks --all

      # 8. بناء APK
      - name: Build Debug APK
        working-directory: project_files
        run: |
          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          gradle :app:assembleDebug --stacktrace --info

      # 9. البحث عن APK الناتج
      - name: Find APK
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find project_files -type f -name "*.apk" -print

      # 10. رفع APK كـ Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaNexus-debug-apk
          path: |
            project_files/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
