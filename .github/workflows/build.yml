name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        run: |
          rm -rf project_files
          mkdir -p project_files

          unzip -o nova-nexus.zip -d project_files

          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          cd project_files
          find . -maxdepth 3 -type f | sort

      - name: Check project configuration
        working-directory: project_files
        run: |
          echo "======================================"
          echo "SETTINGS.GRADLE.KTS"
          echo "======================================"

          cat settings.gradle.kts

          echo ""
          echo "======================================"
          echo "ROOT BUILD.GRADLE.KTS"
          echo "======================================"

          cat build.gradle.kts

          echo ""
          echo "======================================"
          echo "APP BUILD.GRADLE.KTS"
          echo "======================================"

          cat app/build.gradle.kts

      - name: Build APK
        working-directory: project_files
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo "BUILDING :app:assembleDebug"
          echo "======================================"

          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Locate APK
        if: success()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find project_files -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovaNexus-debug-apk
          path: project_files/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
