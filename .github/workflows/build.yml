name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        # فك الضغط
        unzip nova-nexus.zip -d project_files
        cd project_files
        
        # البحث عن المجلد الداخلي والدخول إليه تلقائياً
        cd "$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)"
        
        # عرض الملفات للتأكد من أننا في المكان الصحيح
        echo "المجلد الحالي هو:"
        pwd
        ls -la
        
        # بناء التطبيق (بدون تحديد :app: لأن المجلد اسمه app_files)
        gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: 'project_files/**/build/outputs/apk/debug/*.apk'
