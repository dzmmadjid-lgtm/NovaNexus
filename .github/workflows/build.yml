name: Strict Dynamic Android Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target_zip:
        description: 'Specific ZIP filename to build (e.g. architecture-samples-main.zip)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: 2. Enforce Strict Target Verification & Locate ZIP
        id: verify_target
        run: |
          echo "========================================================"
          echo "🔍 AUDIT STEP 1: VERIFYING REQUESTED TARGET PROJECT"
          echo "========================================================"
          pwd
          ls -la
          
          # استخراج اسم الملف المطلوب صراحة
          REQUESTED_ZIP="${{ github.event.inputs.target_zip }}"
          
          if [ -z "$REQUESTED_ZIP" ]; then
            echo "❌ CRITICAL ERROR: No 'target_zip' parameter provided in workflow_dispatch!"
            exit 1
          fi
          
          echo "Target project requested: '$REQUESTED_ZIP'"
          
          # التأكد الصارم من أن الملف تم رفعه فعلاً وموجود في الـ Runner
          MATCHING_FILE=$(find . -maxdepth 2 -type f -name "$REQUESTED_ZIP" | head -n 1)
          
          if [ -z "$MATCHING_FILE" ] || [ ! -f "$MATCHING_FILE" ]; then
            echo "❌ ========================================================"
            echo "❌ VALIDATION FAILED: Target file '$REQUESTED_ZIP' was NOT found in repository!"
            echo "❌ The app triggered the build without successfully uploading the ZIP to GitHub first."
            echo "❌ Halting build immediately to prevent building legacy projects."
            echo "❌ Available files in repository root:"
            ls -la
            echo "❌ ========================================================"
            exit 1
          fi
          
          FILE_SIZE=$(ls -lh "$MATCHING_FILE" | awk '{print $5}')
          FILE_SHA256=$(sha256sum "$MATCHING_FILE" | awk '{print $1}')
          
          echo "✅ VERIFICATION SUCCESSFUL: File '$MATCHING_FILE' verified."
          echo "SELECTED_FILE=$REQUESTED_ZIP" >> $GITHUB_ENV
          echo "TRANSFERRED_FILE=$MATCHING_FILE" >> $GITHUB_ENV
          echo "TRANSFERRED_FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "FILE_SHA256=$FILE_SHA256" >> $GITHUB_ENV

      - name: 3. Create Fresh Isolated Workspace & Extract
        id: extract_step
        run: |
          # إنشاء مسار معزول مؤقت فريد لكل عملية بناء
          ISOLATED_DIR="${{ runner.temp }}/clean_workspace_$(date +%s%N)"
          rm -rf "$ISOLATED_DIR"
          mkdir -p "$ISOLATED_DIR"
          
          echo "📦 Unzipping $TRANSFERRED_FILE into $ISOLATED_DIR ..."
          unzip -q -o "$TRANSFERRED_FILE" -d "$ISOLATED_DIR"
          
          echo "EXTRACTED_PATH=$ISOLATED_DIR" >> $GITHUB_ENV

      - name: 4. Detect True Project Root & Verify Identity
        id: root_identity
        run: |
          SETTINGS_FILE=$(find "$EXTRACTED_PATH" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ CRITICAL ERROR: Could not locate 'settings.gradle' or 'settings.gradle.kts' in extracted files!"
            exit 1
          fi
          
          REAL_ROOT=$(dirname "$SETTINGS_FILE")
          
          if [ ! -f "$REAL_ROOT/build.gradle" ] && [ ! -f "$REAL_ROOT/build.gradle.kts" ]; then
            echo "❌ CRITICAL ERROR: Found settings.gradle but missing root build.gradle(.kts) in $REAL_ROOT"
            exit 1
          fi
          
          # استخراج اسم المشروع الحقيقي من الـ ZIP المرفوع
          PROJECT_NAME=$(grep -oE 'rootProject\.name\s*=\s*["'"'"'][^"'"'"']+["'"'"']' "$SETTINGS_FILE" | sed -E 's/rootProject\.name\s*=\s*["'"'"']([^"'"'"']+)["'"'"']/\1/' | head -n 1)
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="${SELECTED_FILE%.zip}"
          fi

          # الكشف عن إصدار Gradle المطلوب من الـ Wrapper
          WRAPPER_PROP="$REAL_ROOT/gradle/wrapper/gradle-wrapper.properties"
          DETECTED_GRADLE="9.3.1"
          if [ -f "$WRAPPER_PROP" ]; then
            PARSED_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER_PROP" | sed 's/gradle-//' | head -n 1)
            if [ -n "$PARSED_VER" ]; then
              DETECTED_GRADLE="$PARSED_VER"
            fi
          fi

          echo "========================================================"
          echo "📊 MANDATORY AUDIT PROOF LOGS:"
          echo "SELECTED_FILE=$SELECTED_FILE"
          echo "TRANSFERRED_FILE=$TRANSFERRED_FILE"
          echo "TRANSFERRED_FILE_SIZE=$TRANSFERRED_FILE_SIZE"
          echo "FILE_SHA256=$FILE_SHA256"
          echo "EXTRACTED_PATH=$EXTRACTED_PATH"
          echo "PROJECT_ROOT=$REAL_ROOT"
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME"
          echo "DETECTED_GRADLE=$DETECTED_GRADLE"
          echo "========================================================"

          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "DETECTED_GRADLE=$DETECTED_GRADLE" >> $GITHUB_ENV

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Setup Matching Gradle Version (${{ env.DETECTED_GRADLE }})
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.DETECTED_GRADLE }}

      - name: 8. Prepare Local Signing
        run: |
          cd "$PROJECT_ROOT"
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env .env.example local.properties

      - name: 9. Execute Verified Build
        run: |
          echo "🚀 Executing build for verified target: '$ROOT_PROJECT_NAME' from '$PROJECT_ROOT'"
          cd "$PROJECT_ROOT"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 10. Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ROOT_PROJECT_NAME }}-debug-apk"
          path: "${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk"
          retention-days: 14
