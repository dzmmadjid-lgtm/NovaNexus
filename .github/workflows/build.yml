name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle and Build
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        
        # 1. فك الضغط في مجلد العمل
        unzip nova-nexus.zip -d project_files
        
        # 2. الدخول إلى مجلد المشروع الرئيسي
        cd project_files
        
        # 3. البحث تلقائياً عن مجلد الـ ZIp الداخلي (إذا وُجد) والدخول إليه
        # إذا كان الملف يحتوي على مجلد مثل nova-nexus بداخله، هذه الخطوة ستدخل إليه
        cd "$(find . -maxdepth 1 -type d ! -name '.' | head -n 1)"
        
        # 4. طباعة الملفات للتأكد أننا في المكان الصحيح
        echo "المجلد الحالي هو:"
        pwd
        ls -la
        
        # 5. بناء التطبيق
        gradle :app:assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: 'project_files/**/build/outputs/apk/debug/*.apk'
