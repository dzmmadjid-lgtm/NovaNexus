name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: CLEAN OLD PROJECT FILES
        run: |
          echo "======================================"
          echo "CLEANING OLD FILES"
          echo "======================================"
          
          # حذف جميع ملفات المشروع القديمة
          rm -rf project_files
          rm -rf nova-nexus.zip
          rm -rf *.zip
          
          # حذف أي APK قديم
          find . -name "*.apk" -type f -delete
          
          # حذف caches
          rm -rf ~/.gradle/caches/
          rm -rf .gradle
          
          echo "All old files cleaned!"
          ls -la

      - name: Download latest project ZIP
        run: |
          echo "======================================"
          echo "DOWNLOADING LATEST PROJECT"
          echo "======================================"
          
          # تحميل أحدث ملف ZIP من repository
          # الطريقة الأولى: إذا كان الملف موجود في repository
          if [ -f "nova-nexus.zip" ]; then
            echo "Found nova-nexus.zip"
          else
            echo "ERROR: nova-nexus.zip not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          echo "======================================"
          echo "EXTRACTING PROJECT"
          echo "======================================"
          
          rm -rf project_files
          mkdir -p project_files
          
          # استخراج الملف الجديد
          unzip -o nova-nexus.zip -d project_files
          
          echo "Project extracted successfully!"
          cd project_files
          ls -la

      - name: Create debug keystore
        working-directory: project_files
        run: |
          echo "======================================"
          echo "CREATING DEBUG KEYSTORE"
          echo "======================================"

          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          fi

          ls -lh debug.keystore

      - name: Check Gradle
        working-directory: project_files
        run: |
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

      - name: Build Debug APK
        working-directory: project_files
        run: |
          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          # تنظيف قبل البناء
          gradle clean --no-daemon
          
          # بناء APK جديد
          gradle :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks

      - name: Locate APK
        if: success()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find project_files \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovaNexus-debug-apk-$(date +%Y%m%d-%H%M%S)
          path: project_files/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build completed
        if: success()
        run: |
          echo ""
          echo "======================================"
          echo "     BUILD SUCCESS"
          echo "======================================"
          echo ""

          find project_files/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
