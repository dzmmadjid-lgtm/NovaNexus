name: Strict Dynamic Android Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target_zip:
        description: 'Specific ZIP filename to build (optional, e.g. architecture-samples-main.zip)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Clean Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: 2. Locate and Verify Selected Target Project
        id: select_project
        run: |
          echo "========================================================"
          echo "🔍 AUDIT: VALIDATING TARGET PROJECT ZIP FILE"
          echo "========================================================"
          
          SPECIFIED_ZIP="${{ github.event.inputs.target_zip }}"
          TARGET_ZIP=""

          if [ -n "$SPECIFIED_ZIP" ]; then
            echo "User requested specific project: $SPECIFIED_ZIP"
            if [ -f "$SPECIFIED_ZIP" ]; then
              TARGET_ZIP="$SPECIFIED_ZIP"
            else
              echo "❌ CRITICAL ERROR: Requested file '$SPECIFIED_ZIP' was NOT found in the repository!"
              echo "Available files in repository root:"
              ls -la
              exit 1
            fi
          else
            # Search for zip files in repository
            ZIP_COUNT=$(find . -maxdepth 2 -type f -name "*.zip" | wc -l)
            echo "Total zip files detected in repository: $ZIP_COUNT"
            find . -maxdepth 2 -type f -name "*.zip" -exec ls -lh {} +
            
            if [ "$ZIP_COUNT" -gt 0 ]; then
              # Pick the newest zip file
              TARGET_ZIP=$(find . -maxdepth 2 -type f -name "*.zip" -printf '%T@ %p\n' | sort -n | tail -1 | cut -f2- -d" ")
              echo "🎯 Auto-selected newest ZIP archive: $TARGET_ZIP"
            else
              echo "⚠️ No ZIP file found in repository. Checking if direct project source exists..."
              if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
                echo "❌ CRITICAL ERROR: Neither a target ZIP nor an Android project root was found!"
                exit 1
              fi
            fi
          fi

          echo "TARGET_ZIP=$TARGET_ZIP" >> $GITHUB_ENV

      - name: 3. Create Fresh Isolated Workspace & Extract
        id: extract_project
        run: |
          echo "========================================================"
          echo "📦 AUDIT: EXTRACTING INTO FRESH ISOLATED WORKSPACE"
          echo "========================================================"
          
          ISOLATED_DIR="${{ runner.temp }}/isolated_build_workspace_$(date +%s)"
          rm -rf "$ISOLATED_DIR"
          mkdir -p "$ISOLATED_DIR"
          
          if [ -n "$TARGET_ZIP" ] && [ -f "$TARGET_ZIP" ]; then
            echo "Extracting: $TARGET_ZIP -> $ISOLATED_DIR"
            unzip -q -o "$TARGET_ZIP" -d "$ISOLATED_DIR"
          else
            echo "Copying repository files into isolated workspace..."
            rsync -av --exclude='.git' --exclude='.github' ./ "$ISOLATED_DIR/"
          fi

          echo "ISOLATED_DIR=$ISOLATED_DIR" >> $GITHUB_ENV

      - name: 4. Detect & Validate Project Root & Name
        id: validate_root
        run: |
          echo "========================================================"
          echo "🔎 AUDIT: DETECTING AND VERIFYING REAL PROJECT ROOT"
          echo "========================================================"
          
          # Search for settings.gradle or settings.gradle.kts
          SETTINGS_PATH=$(find "$ISOLATED_DIR" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "❌ CRITICAL ERROR: Could not locate 'settings.gradle' or 'settings.gradle.kts' in extracted workspace!"
            echo "Workspace content tree:"
            find "$ISOLATED_DIR" -maxdepth 3
            exit 1
          fi
          
          REAL_ROOT=$(dirname "$SETTINGS_PATH")
          
          # Verify build.gradle exists alongside or inside modules
          if [ ! -f "$REAL_ROOT/build.gradle" ] && [ ! -f "$REAL_ROOT/build.gradle.kts" ]; then
            echo "❌ CRITICAL ERROR: Found settings.gradle but missing root build.gradle(.kts) in $REAL_ROOT"
            exit 1
          fi
          
          # Extract root project name from settings.gradle / settings.gradle.kts
          PROJECT_NAME=$(grep -oE 'rootProject\.name\s*=\s*["'"'"'][^"'"'"']+["'"'"']' "$SETTINGS_PATH" | sed -E 's/rootProject\.name\s*=\s*["'"'"']([^"'"'"']+)["'"'"']/\1/' | head -n 1)
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="Unknown (No rootProject.name in settings)"
          fi

          # Output required verification logs
          echo "========================================================"
          echo "📊 MANDATORY AUDIT LOGS:"
          echo "SELECTED_FILE=${{ github.event.inputs.target_zip || env.TARGET_ZIP }}"
          echo "TRANSFERRED_FILE=$TARGET_ZIP"
          echo "EXTRACTED_PATH=$ISOLATED_DIR"
          echo "PROJECT_ROOT=$REAL_ROOT"
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME"
          echo "========================================================"

          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "ROOT_PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 6. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 8. Prepare Local Environment in True Root
        run: |
          cd "$PROJECT_ROOT"
          
          # Ensure essential debug keystore exists
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          touch .env .env.example local.properties

      - name: 9. Build Verified Target Project
        run: |
          echo "🚀 Executing build for: $ROOT_PROJECT_NAME in $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 10. Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ROOT_PROJECT_NAME }}-debug-apk"
          path: "${{ env.PROJECT_ROOT }}/**/build/outputs/apk/debug/*.apk"
          retention-days: 14
